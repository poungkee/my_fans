name: AI Worker CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/ai-worker/**'
      - 'backend/queue/**'
      - '.github/workflows/ai-worker.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/ai-worker/**'
      - 'backend/queue/**'

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: fans-cluster
  K8S_NAMESPACE: fans

jobs:
  build-and-deploy:
    name: Build and Deploy AI Worker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push AI Worker
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fans/ai-worker
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        echo "📂 Build context: $(pwd)"
        echo "📋 Listing files..."
        ls -la ai-worker/ || true
        ls -la queue/ || true
        echo "🔨 Starting Docker build..."
        docker buildx build \
          --file ai-worker/Dockerfile \
          --no-cache \
          --progress=plain \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --push \
          .
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.build-image.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Deploy AI Worker to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fans/ai-worker
        IMAGE_TAG: ${{ github.sha }}
      run: |
        aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
        kubectl set image deployment/ai-worker \
          ai-worker=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout status deployment/ai-worker -n ${{ env.K8S_NAMESPACE }} --timeout=5m

    - name: Deployment summary
      if: success()
      run: |
        echo "✅ AI Worker deployed successfully!"
        echo "📦 Image: ${{ steps.build-image.outputs.image }}"
        echo "🔖 Git SHA: ${{ github.sha }}"
        echo "👤 Deployed by: ${{ github.actor }}"
