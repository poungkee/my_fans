name: Crawler & Scheduler CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/crawler/**'
      - 'backend/scheduler/**'
      - '.github/workflows/crawler-scheduler.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/crawler/**'
      - 'backend/scheduler/**'

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: fans-cluster
  K8S_NAMESPACE: fans

jobs:
  build-unified-crawler:
    name: Build and Deploy Unified Crawler
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Unified Crawler
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fans/unified-crawler
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/crawler
        docker buildx build \
          --file crawler-v2/Dockerfile \
          --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache \
          --cache-to type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:buildcache,mode=max \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --push \
          .
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.build-image.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Deploy Unified Crawler to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fans/unified-crawler
        IMAGE_TAG: ${{ github.sha }}
      run: |
        aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
        kubectl set image deployment/unified-crawler \
          unified-crawler=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout status deployment/unified-crawler -n ${{ env.K8S_NAMESPACE }} --timeout=5m

    - name: Deployment summary
      if: success()
      run: |
        echo "✅ Unified Crawler deployed successfully!"
        echo "📦 Image: ${{ steps.build-image.outputs.image }}"

  build-scheduler:
    name: Build and Deploy Scheduler
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Scheduler
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fans/scheduler
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        docker buildx build \
          --file scheduler/Dockerfile \
          --no-cache \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          --push \
          .
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.build-image.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Deploy Scheduler to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: fans/scheduler
        IMAGE_TAG: ${{ github.sha }}
      run: |
        aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
        kubectl set image deployment/scheduler \
          scheduler=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout status deployment/scheduler -n ${{ env.K8S_NAMESPACE }} --timeout=5m

    - name: Deployment summary
      if: success()
      run: |
        echo "✅ Scheduler deployed successfully!"
        echo "📦 Image: ${{ steps.build-image.outputs.image }}"
