apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: ai-worker
spec:
  # AMI 선택
  amiFamily: AL2

  # 서브넷 선택 (Private Subnets)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: fans-cluster

  # 보안 그룹 선택
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: fans-cluster

  # IAM 인스턴스 프로파일
  role: KarpenterNodeRole-fans-cluster

  # 사용자 데이터
  userData: |
    #!/bin/bash
    echo "Karpenter AI Worker Node (Spot)"
    # Spot 인스턴스 중단 핸들러 설치
    yum install -y amazon-cloudwatch-agent

    # Spot 중단 알림 모니터링 (2분 전에 알림)
    cat > /usr/local/bin/spot-termination-handler.sh <<'EOF'
    #!/bin/bash
    while true; do
      if curl -s http://169.254.169.254/latest/meta-data/spot/termination-time | grep -q .*T.*Z; then
        echo "Spot instance termination notice detected"
        kubectl drain $(hostname) --ignore-daemonsets --delete-emptydir-data --force
        sleep 120
      fi
      sleep 5
    done
    EOF
    chmod +x /usr/local/bin/spot-termination-handler.sh
    nohup /usr/local/bin/spot-termination-handler.sh &

  # 블록 디바이스 (AI Worker는 작은 볼륨)
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        iops: 3000
        encrypted: true
        deleteOnTermination: true

  # 메타데이터 옵션
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  # 태그
  tags:
    Name: karpenter-ai-worker-node
    Environment: production
    ManagedBy: karpenter
    WorkloadType: ai-worker
    CapacityType: spot
