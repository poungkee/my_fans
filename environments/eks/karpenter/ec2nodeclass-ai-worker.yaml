apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: ai-worker
spec:
  # AMI 선택
  amiFamily: AL2

  # 서브넷 선택 (Private Subnets)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: fans-cluster

  # 보안 그룹 선택
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: fans-cluster

  # IAM 인스턴스 프로파일
  role: fans-main-workers-eks-node-group-20251031070013413000000002

  # userData removed to allow Karpenter to inject EKS bootstrap script automatically

  # 블록 디바이스 (AI Worker는 작은 볼륨)
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        iops: 3000
        encrypted: true
        deleteOnTermination: true

  # 메타데이터 옵션
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  # 태그
  tags:
    Name: karpenter-ai-worker-node
    Environment: production
    ManagedBy: karpenter
    WorkloadType: ai-worker
    CapacityType: spot
