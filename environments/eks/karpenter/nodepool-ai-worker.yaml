apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: ai-worker
spec:
  # 템플릿 설정
  template:
    metadata:
      labels:
        workload-type: ai-worker
    spec:
      nodeClassRef:
        name: ai-worker
      requirements:
        # Spot 인스턴스 사용 (60-90% 비용 절감)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # CPU 최적화 인스턴스 (AI Worker용)
        # AI 서비스는 최소 8GB RAM 필요 → xlarge 이상만 허용
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - c5.xlarge     # 4 vCPU, 8GB RAM
            - c5a.xlarge    # AMD EPYC (저렴, 4 vCPU, 8GB)
            - c6i.xlarge    # 최신 세대 (4 vCPU, 8GB)
            - c5.2xlarge    # 8 vCPU, 16GB RAM
            - c5a.2xlarge
            - c6i.2xlarge
      # Taints (AI Worker만 스케줄링되도록)
      taints:
        - key: workload-type
          value: ai-worker
          effect: NoSchedule
      # Kubelet 설정
      kubelet:
        maxPods: 110
        evictionHard:
          memory.available: "5%"
          nodefs.available: "10%"
        systemReserved:
          cpu: "100m"
          memory: "100Mi"

  # 제한 설정
  limits:
    cpu: "16"      # 최대 16 vCPU
    memory: 32Gi   # 최대 32GB RAM

  # Disruption 설정 (Spot 중단 대응)
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 168h  # 7일 후 노드 교체 (Spot은 짧게)
    budgets:
      - nodes: "50%"  # Spot은 중단 가능성 있으므로 50%까지 동시 교체 허용
