# ==================================
# Karpenter NodePool (AI Worker용 Spot Instance)
# ==================================
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: ai-worker-spot
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]  # Spot Instance (70% 절감)
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3.large"]  # AI Worker에 적합한 크기

      nodeClassRef:
        name: default

      taints:
        - key: workload
          value: ai-worker
          effect: NoSchedule

  limits:
    cpu: "20"  # 최대 약 10개 Pod (t3.medium * 10)

  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h  # 30일

---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2  # Amazon Linux 2
  role: "fans-cluster-karpenter-node"  # Terraform에서 생성된 IAM Role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "fans-cluster"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/fans-cluster: "owned"

  userData: |
    #!/bin/bash
    echo "Karpenter AI Worker Node Initializing..."
