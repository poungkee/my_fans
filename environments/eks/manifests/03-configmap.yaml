apiVersion: v1
kind: ConfigMap
metadata:
  name: fans-config
  namespace: fans
data:
  # Environment
  NODE_ENV: production
  PORT: "3000"

  # AI Services URLs (Kubernetes DNS)
  AI_SERVICE_URL: http://summarize-ai-service:8000
  SUMMARIZE_AI_URL: http://summarize-ai-service:8000
  BIAS_AI_URL: http://bias-analysis-ai-service:8002
  BIAS_ANALYSIS_AI_URL: http://bias-analysis-ai-service:8002

  # Ports
  SUMMARIZE_AI_PORT: "8000"
  BIAS_ANALYSIS_AI_PORT: "8002"
  UNIFIED_CRAWLER_PORT: "4007"

  # AI Model
  MODEL_NAME: eenzeenee/t5-base-korean-summarization
  MAX_SUMMARY_LENGTH: "100"

  # Crawler Settings
  AUTO_CRAWL: "true"
  CRAWL_INTERVAL: "300000"
  CRAWL_LIMIT_PER_CATEGORY: "20"

  # Scheduler
  SCHEDULE_INTERVAL: "*/10 * * * *"
  RUN_ON_START: "false"
  RAW_NEWS_BATCH_SIZE: "100"
  SUMMARY_BATCH_SIZE: "50"
  LOG_LEVEL: info

  # Frontend
  FRONTEND_URL: https://www.fans.ai.kr
  CORS_ALLOWED_ORIGINS: https://www.fans.ai.kr

  # React (for frontend)
  REACT_APP_API_BASE: https://www.fans.ai.kr
  REACT_APP_API_URL: https://www.fans.ai.kr/api
  REACT_APP_AI_SERVICE_URL: https://www.fans.ai.kr

  # OAuth Redirect URIs
  KAKAO_REDIRECT_URI: https://www.fans.ai.kr/api/auth/kakao/callback
  NAVER_REDIRECT_URI: https://www.fans.ai.kr/api/auth/naver/callback

  # S3 Configuration
  AWS_REGION: ap-northeast-2
  AWS_S3_BUCKET: fans-eks-frontend-907123164281
  PROFILE_IMAGE_PATH: profile-images
  PROFILE_IMAGE_BASE_URL: https://fans-eks-frontend-907123164281.s3.ap-northeast-2.amazonaws.com/profile-images
