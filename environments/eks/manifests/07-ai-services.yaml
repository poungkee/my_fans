    targetPort: 8002
  type: ClusterIP

---
# Classification API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classification-api
  namespace: fans
spec:
  replicas: 2
  selector:
    matchLabels:
      app: classification-api
  template:
    metadata:
      labels:
        app: classification-api
    spec:
      containers:
      - name: classification-api
        image: 907123164281.dkr.ecr.ap-northeast-2.amazonaws.com/fans/classification-api:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: fans-config
        - secretRef:
            name: fans-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10

---
# Classification API Service
apiVersion: v1
kind: Service
metadata:
  name: classification-api-service
  namespace: fans
spec:
  selector:
    app: classification-api
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
