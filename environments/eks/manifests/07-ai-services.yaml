        command: ["python", "main.py"]
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          value: "8002"
        envFrom:
        - configMapRef:
            name: fans-config
        - secretRef:
            name: fans-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10

---
# Bias Analysis AI Service
apiVersion: v1
kind: Service
metadata:
  name: bias-analysis-ai-service
  namespace: fans
spec:
  selector:
    app: bias-analysis-ai
  ports:
