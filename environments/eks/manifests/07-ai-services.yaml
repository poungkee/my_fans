---
# Summarize AI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summarize-ai
  namespace: fans
spec:
  replicas: 2
  selector:
    matchLabels:
      app: summarize-ai
  template:
    metadata:
      labels:
        app: summarize-ai
    spec:
      containers:
      - name: summarize-ai
        image: 907123164281.dkr.ecr.ap-northeast-2.amazonaws.com/fans/summarize-ai:latest
        command: ["python", "-u", "main.py"]
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        envFrom:
        - configMapRef:
            name: fans-config
        - secretRef:
            name: fans-secrets
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10

---
# Summarize AI Service
apiVersion: v1
kind: Service
metadata:
  name: summarize-ai-service
  namespace: fans
spec:
  selector:
    app: summarize-ai
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

---
# Bias Analysis AI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bias-analysis-ai
  namespace: fans
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bias-analysis-ai
  template:
    metadata:
      labels:
        app: bias-analysis-ai
    spec:
      containers:
      - name: bias-analysis-ai
