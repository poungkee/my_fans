apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ai-worker-scaler
  namespace: fans
spec:
  scaleTargetRef:
    name: ai-worker

  # 스케일링 범위
  minReplicaCount: 1    # 최소 1개 (비용 절감)
  maxReplicaCount: 20   # 최대 20개

  # Cooldown 기간
  pollingInterval: 10   # 10초마다 메트릭 확인
  cooldownPeriod: 60    # 스케일 다운 후 60초 대기

  # 트리거: BullMQ 큐 길이 기반
  triggers:
    # AI Summary Queue
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        listName: "bull:ai-summary:wait"
        listLength: "5"   # 대기 중인 작업 5개당 Pod 1개
        databaseIndex: "0"

    # AI Bias Queue
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        listName: "bull:ai-bias:wait"
        listLength: "5"
        databaseIndex: "0"

    # AI Keyword Queue
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        listName: "bull:ai-keyword:wait"
        listLength: "5"
        databaseIndex: "0"

    # AI Recommendation Queue
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        listName: "bull:ai-recommendation:wait"
        listLength: "10"  # 추천은 더 무거우므로 10개당 1개
        databaseIndex: "0"

  # 스케일링 동작 설정
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300  # 5분 동안 안정화 후 스케일 다운
          policies:
            - type: Percent
              value: 50    # 한 번에 최대 50% 축소
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0   # 즉시 스케일 업
          policies:
            - type: Percent
              value: 100   # 한 번에 최대 100% 증가
              periodSeconds: 15
            - type: Pods
              value: 4     # 또는 한 번에 최대 4개 추가
              periodSeconds: 15
          selectPolicy: Max  # 위 두 정책 중 더 공격적인 것 선택

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-redis-config
  namespace: fans
data:
  REDIS_HOST: "fans-redis:6379"
