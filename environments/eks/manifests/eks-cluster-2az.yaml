apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: fans-cluster-2az
  region: ap-northeast-2
  version: "1.31"

# 2-AZ VPC 설정
vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: HighlyAvailable  # 각 AZ마다 NAT Gateway 생성 (2개)
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

# 가용 영역 설정 (2개만 사용)
availabilityZones:
  - ap-northeast-2a
  - ap-northeast-2c

# IAM OIDC Provider 활성화
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true
    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      wellKnownPolicies:
        ebsCSIController: true

# CloudWatch 로깅
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]

# 애드온
addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: aws-ebs-csi-driver
    version: latest

# 노드 그룹 (Medium - 2 AZ)
managedNodeGroups:
  - name: fans-private-medium-2az
    instanceType: t3.medium
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true
    availabilityZones:
      - ap-northeast-2a
      - ap-northeast-2c
    labels:
      role: backend
      tier: medium
    tags:
      nodegroup-role: backend
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/fans-cluster-2az: "owned"
    iam:
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  # 노드 그룹 (Large - 2 AZ)
  - name: fans-private-large-2az
    instanceType: t3.large
    minSize: 2
    maxSize: 4
    desiredCapacity: 2
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true
    availabilityZones:
      - ap-northeast-2a
      - ap-northeast-2c
    labels:
      role: ai
      tier: large
    tags:
      nodegroup-role: ai
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/fans-cluster-2az: "owned"
    iam:
      attachPolicyARNs:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
