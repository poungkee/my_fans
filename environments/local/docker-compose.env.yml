# docker-compose.env.yml
# 환경별 .env 파일 자동 선택을 위한 Docker Compose 설정
# 사용법: DEPLOY_ENV=ecs docker-compose -f docker-compose.yml -f docker-compose.env.yml up -d

version: '3.8'

# 모든 서비스에 환경별 .env 파일 적용
services:
  postgres:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  redis:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  main-api:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  summarize-ai:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  bias-analysis-ai:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  unified-crawler:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  classification-api:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  scheduler:
    env_file:
      - .env.${DEPLOY_ENV:-local}

  frontend:
    env_file:
      - .env.${DEPLOY_ENV:-local}
    build:
      args:
        # React 빌드 시점에 환경변수 주입
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_AI_SERVICE_URL: ${REACT_APP_AI_SERVICE_URL}
