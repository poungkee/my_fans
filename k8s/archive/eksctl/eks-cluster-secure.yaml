apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: fans-cluster
  region: ap-northeast-2
  version: "1.31"

# VPC 설정 - Private 서브넷 사용
vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: Single  # NAT Gateway를 통해 Private 서브넷이 인터넷 접근
  clusterEndpoints:
    publicAccess: true   # kubectl 접근을 위해 유지 (IP 제한 권장)
    privateAccess: true  # VPC 내부에서 Private 접근 가능

# IAM 설정
iam:
  withOIDC: true

# Node Groups - Private 서브넷에 배치
managedNodeGroups:
  - name: fans-nodegroup-private
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 2
    maxSize: 5
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true  # 🔒 Private 서브넷에 배치
    labels:
      role: worker
      subnet-type: private
    tags:
      nodegroup-name: fans-nodegroup-private
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        ebs: true
        efs: true
        albIngress: true
        cloudWatch: true
    # Security Group 최소 권한 설정
    securityGroups:
      withShared: true
      withLocal: true

# CloudWatch 로깅
cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]
