apiVersion: v1
kind: ConfigMap
metadata:
  name: fans-config
  namespace: default
data:
  # RDS 정보
  DB_HOST: "fans-postgres.cz884ewuuhlv.ap-northeast-2.rds.amazonaws.com"
  DB_PORT: "5432"

  # Redis 정보
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # 서비스 URL (Kubernetes 내부 DNS)
  MAIN_API_URL: "http://main-api-service:3000"
  SUMMARIZE_AI_URL: "http://summarize-ai-service:8000"
  BIAS_ANALYSIS_AI_URL: "http://bias-analysis-ai-service:8002"
  CLASSIFICATION_API_URL: "http://classification-api-service:5000"
  API_CRAWLER_URL: "http://api-crawler-service:4003"
  PUPPETEER_CRAWLER_URL: "http://puppeteer-crawler-service:4004"

  # 포트 설정
  PORT: "3000"
  FRONTEND_PORT: "3001"
  API_CRAWLER_PORT: "4003"
  PUPPETEER_CRAWLER_PORT: "4004"
  CLASSIFICATION_API_PORT: "5000"
  SUMMARIZE_AI_PORT: "8000"
  BIAS_ANALYSIS_AI_PORT: "8002"

  # 크롤러 설정
  AUTO_CRAWL: "true"
  CRAWL_INTERVAL_MINUTES: "5"
  CRAWL_LIMIT_PER_CATEGORY: "5"
  CRAWL_INTERVAL: "180000"
  TOTAL_REPLICAS: "3"

  # 스케줄러 설정
  SCHEDULE_INTERVAL: "*/10 * * * *"
  RUN_ON_START: "false"
  RAW_NEWS_BATCH_SIZE: "100"
  SUMMARY_BATCH_SIZE: "50"
  LOG_LEVEL: "info"

  # 환경
  NODE_ENV: "production"

  # AI 모델 설정
  MODEL_NAME: "facebook/bart-large-cnn"
  MAX_SUMMARY_LENGTH: "150"
