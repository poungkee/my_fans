# ========================================
# API Crawler Service
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-crawler
  labels:
    app: api-crawler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-crawler
  template:
    metadata:
      labels:
        app: api-crawler
    spec:
      containers:
      - name: api-crawler
        image: 907123164281.dkr.ecr.ap-northeast-2.amazonaws.com/fans/api-crawler:latest
        ports:
        - containerPort: 4003
        env:
        - name: API_CRAWLER_PORT
          value: "4003"
        - name: AUTO_CRAWL
          value: "true"
        - name: CRAWL_INTERVAL_MINUTES
          value: "5"
        - name: CRAWL_LIMIT_PER_CATEGORY
          value: "5"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: DB_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_PASSWORD
        - name: NAVER_SEARCH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: NAVER_SEARCH_CLIENT_ID
        - name: NAVER_SEARCH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: NAVER_SEARCH_CLIENT_SECRET
        - name: NAVER_CLIENT_ID_2
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: NAVER_CLIENT_ID_2
        - name: NAVER_CLIENT_SECRET_2
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: NAVER_CLIENT_SECRET_2
        - name: BIAS_ANALYSIS_AI_URL
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: BIAS_ANALYSIS_AI_URL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-crawler-service
spec:
  selector:
    app: api-crawler
  ports:
  - protocol: TCP
    port: 4003
    targetPort: 4003
  type: ClusterIP

---
# ========================================
# Puppeteer Crawler Service (3 replicas)
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: puppeteer-crawler
  labels:
    app: puppeteer-crawler
spec:
  replicas: 3
  selector:
    matchLabels:
      app: puppeteer-crawler
  template:
    metadata:
      labels:
        app: puppeteer-crawler
    spec:
      containers:
      - name: puppeteer-crawler
        image: 907123164281.dkr.ecr.ap-northeast-2.amazonaws.com/fans/puppeteer-crawler:latest
        ports:
        - containerPort: 4004
        env:
        - name: PUPPETEER_CRAWLER_PORT
          value: "4004"
        - name: AUTO_CRAWL
          value: "true"
        - name: CRAWL_INTERVAL
          value: "180000"
        - name: TOTAL_REPLICAS
          value: "3"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: DB_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: puppeteer-crawler-service
spec:
  selector:
    app: puppeteer-crawler
  ports:
  - protocol: TCP
    port: 4004
    targetPort: 4004
  type: ClusterIP

---
# ========================================
# Scheduler Service
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
      - name: scheduler
        image: 907123164281.dkr.ecr.ap-northeast-2.amazonaws.com/fans/scheduler:latest
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: DB_PORT
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fans-secrets
              key: POSTGRES_PASSWORD
        - name: CLASSIFICATION_API_URL
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: CLASSIFICATION_API_URL
        - name: SUMMARIZE_AI_URL
          valueFrom:
            configMapKeyRef:
              name: fans-config
              key: SUMMARIZE_AI_URL
        - name: SCHEDULE_INTERVAL
          value: "*/10 * * * *"
        - name: RUN_ON_START
          value: "false"
        - name: RAW_NEWS_BATCH_SIZE
          value: "100"
        - name: SUMMARY_BATCH_SIZE
          value: "50"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
