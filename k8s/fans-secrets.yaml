apiVersion: v1
kind: Secret
metadata:
  name: fans-secrets
  namespace: default
type: Opaque
stringData:
  # RDS PostgreSQL 인증 정보
  POSTGRES_DB: "fans_db"
  POSTGRES_USER: "fans_admin"
  POSTGRES_PASSWORD: "FansDB2025!SecurePass"

  # JWT Secret (필요시 수정)
  JWT_SECRET: "fans-jwt-secret-key-2025-production"

  # Email 설정 (Gmail 앱 비밀번호)
  EMAIL_USER: "dummy@gmail.com"
  EMAIL_PASSWORD: "dummy-app-password"

  # Naver API Keys
  NAVER_SEARCH_CLIENT_ID: "dummy-client-id"
  NAVER_SEARCH_CLIENT_SECRET: "dummy-client-secret"
  NAVER_CLIENT_ID_2: "dummy-client-id-2"
  NAVER_CLIENT_SECRET_2: "dummy-client-secret-2"

  # API Keys (필요시 추가)
  # OPENAI_API_KEY: "your-key-here"
