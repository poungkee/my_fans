apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fans-ingress
  annotations:
    # ALB (Application Load Balancer) 설정
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'

    # SSL 설정 (ACM 인증서 발급 후 아래 주석 해제)
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:907123164281:certificate/YOUR_CERT_ID
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: '443'

    # 태그
    alb.ingress.kubernetes.io/tags: Environment=production,Project=FANS,ManagedBy=Kubernetes
spec:
  ingressClassName: alb
  rules:
  # 도메인 없이 사용 (Load Balancer URL로 직접 접속)
  - http:
      paths:
      # API 경로
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: main-api-service
            port:
              number: 3000

      # 프론트엔드 (루트 경로)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3001

  # 도메인 설정 (선택 사항)
  # - host: your-domain.com
  #   http:
  #     paths:
  #     - path: /api
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: main-api-service
  #           port:
  #             number: 3000
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: frontend-service
  #           port:
  #             number: 3001
